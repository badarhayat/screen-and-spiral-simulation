name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/windows-exe-packaging-0afd
      - cursor/results-back-navigation-0afd

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.10,<7"

      - name: Build one-file executable
        run: python -m PyInstaller --noconfirm --clean packaging/SpiralConcentrator.spec

      - name: Command-line smoke test
        run: dist\SpiralConcentrator.exe --example

      - name: Browser mode smoke test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\SpiralConcentrator.exe -ArgumentList "--web","--no-browser","--port","8099" -PassThru
          try {
            $page = $null
            for ($try = 0; $try -lt 20; $try++) {
              Start-Sleep -Seconds 1
              try {
                $page = Invoke-WebRequest -Uri http://127.0.0.1:8099/ -UseBasicParsing
                break
              } catch {
                Write-Host "waiting for the server"
              }
            }
            if ($null -eq $page -or $page.StatusCode -ne 200) {
              throw "SpiralConcentrator.exe --web did not serve the page"
            }
            if ($page.Content -notmatch "Spiral concentrator") {
              throw "The served page is not the simulator"
            }
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SpiralConcentrator-windows
          path: dist/SpiralConcentrator.exe
          if-no-files-found: error
